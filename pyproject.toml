[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swinydl"
dynamic = ["version"]
description = "SWinyDL: transcript-first Echo360 tooling for macOS Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "David Siroky" }]
dependencies = [
  "huggingface-hub>=0.31.0",
  "requests>=2.32.0",
  "truststore>=0.10.0",
  "yt-dlp>=2025.1.15",
]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so the swinydl package imports cleanly when running
# `uv run pytest` from a fresh clone.
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
swinydl = "swinydl.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["swinydl*"]

[tool.setuptools.dynamic]
version = { attr = "swinydl.version.__version__" }
